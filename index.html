<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BOBTI (보비티아이) - 우리 부부 보드게임 성향 검사</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-light: #6366f1;
      --secondary: #ec4899;
      --accent: #f59e0b;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 16px;
    }
    #app-container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding-bottom: 40px;
    }
    .card {
      background-color: var(--card-bg);
      border-radius: 20px;
      border: 1px solid var(--border);
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      text-align: center;
      background: linear-gradient(135deg, #a5b4fc, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 14px;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      background: rgba(99, 102, 241, 0.2);
      color: #a5b4fc;
      margin-bottom: 8px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px 20px;
      border-radius: 14px;
      border: none;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
      margin-top: 12px;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
    }
    .btn-primary:active {
      transform: scale(0.98);
      opacity: 0.9;
    }
    .btn-secondary {
      background: var(--border);
      color: var(--text);
    }
    .input-field {
      width: 100%;
      padding: 14px 16px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: white;
      font-size: 15px;
      margin-bottom: 16px;
      outline: none;
    }
    .input-field:focus {
      border-color: var(--primary-light);
    }
    .chip-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }
    .chip {
      padding: 12px;
      border-radius: 12px;
      background: #0f172a;
      border: 1px solid var(--border);
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s ease;
    }
    .chip.selected {
      background: rgba(99, 102, 241, 0.25);
      border-color: var(--primary-light);
      color: #c7d2fe;
      font-weight: 600;
    }
    .question-box {
      margin-bottom: 24px;
    }
    .question-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #e2e8f0;
    }
    .question-desc {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }
    .option-btn {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      background: #0f172a;
      border: 1px solid var(--border);
      color: #cbd5e1;
      font-size: 14px;
      text-align: left;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.15s;
      line-height: 1.4;
    }
    .option-btn.selected {
      background: rgba(99, 102, 241, 0.2);
      border-color: var(--primary-light);
      color: #ffffff;
      font-weight: 600;
    }
    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: var(--border);
      border-radius: 10px;
      margin-bottom: 20px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      transition: width 0.3s ease;
    }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .game-card {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      position: relative;
    }
    .game-title {
      font-size: 17px;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .game-meta {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .game-summary {
      font-size: 13px;
      color: #cbd5e1;
      line-height: 1.45;
    }
    .match-tag {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      padding: 2px 8px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
    }
    .tab-container {
      display: flex;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }
    .tab-btn.active {
      color: var(--primary-light);
      border-bottom: 2px solid var(--primary-light);
    }
  </style>
</head>
<body>
  <div id="app-container">
    <!-- 화면이 자바스크립트로 렌더링됩니다 -->
  </div>

  <script src="data.js"></script>
  <script src="algorithm.js"></script>
  <script>
    // 상태 관리 (localStorage 연동)
    const STATE = {
      step: 'home', // 'home', 'survey', 'waiting', 'results'
      currentUser: 1, // 1: 배우자 A, 2: 배우자 B
      sheetsWebhookUrl: localStorage.getItem('bobti_sheets_url') || '',
      user1: { name: '', played: [], themes: [], answers: {}, timePref: '30~60분' },
      user2: { name: '', played: [], themes: [], answers: {}, timePref: '30~60분' },
      currentQIndex: 0
    };

    // 로컬 스토리지에서 이전 응답 복원
    function loadSavedState() {
      const saved = localStorage.getItem('bobti_state');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          Object.assign(STATE, parsed);
        } catch (e) {}
      }
      STATE.sheetsWebhookUrl = localStorage.getItem('bobti_sheets_url') || STATE.sheetsWebhookUrl || '';
    }

    function saveState() {
      localStorage.setItem('bobti_state', JSON.stringify(STATE));
      if (STATE.sheetsWebhookUrl) {
        localStorage.setItem('bobti_sheets_url', STATE.sheetsWebhookUrl);
      }
    }

    function resetAllState() {
      if (confirm('새로운 커플 검사를 위해 모든 입력 데이터를 초기화하시겠습니까?')) {
        const webhookBackup = STATE.sheetsWebhookUrl;
        STATE.step = 'home';
        STATE.currentUser = 1;
        STATE.currentQIndex = 0;
        STATE.user1 = { name: '', played: [], themes: [], answers: {}, timePref: '30~60분' };
        STATE.user2 = { name: '', played: [], themes: [], answers: {}, timePref: '30~60분' };
        STATE.sheetsWebhookUrl = webhookBackup;
        localStorage.removeItem('bobti_state');
        saveState();
        render();
      }
    }

    function render() {
      const root = document.getElementById('app-container');
      root.innerHTML = '';

      if (STATE.step === 'home') {
        renderHome(root);
      } else if (STATE.step === 'survey') {
        renderSurvey(root);
      } else if (STATE.step === 'waiting') {
        renderWaiting(root);
      } else if (STATE.step === 'results') {
        renderResults(root);
      }
    }

    function renderHome(root) {
      root.innerHTML = `
        <div class="card">
          <div style="text-align: center; font-size: 40px; margin-bottom: 10px;">🎲✨</div>
          <h1>BOBTI 보비티아이</h1>
          <p class="subtitle">우리 부부만을 위한 맞춤형 보드게임 성향 분석 & Game Night 추천</p>
          
          <div style="background: rgba(99, 102, 241, 0.1); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 20px;">
            <div style="font-weight: 700; color: #a5b4fc; margin-bottom: 6px; font-size: 15px;">💡 진행 방법</div>
            <div style="font-size: 13px; color: #cbd5e1; line-height: 1.5;">
              1. 부부 두 분이 각자 <strong>3분간 8가지 질문</strong>에 응답합니다.<br>
              2. 두 분의 성향(경쟁, 계획, 몰입도, 공격성)을 분석합니다.<br>
              3. 호스트가 보유한 <strong>41개 명작 보드게임</strong> 중 오늘 밤 딱 맞는 <strong>Opening → 본 게임 → 심화 게임</strong> 코스를 완성합니다!
            </div>
          </div>

          <button class="btn btn-primary" onclick="startSurvey(1)">
            👤 1번째 분 (${STATE.user1.name || '시작하기'})
          </button>
          ${STATE.user1.name ? `
            <button class="btn btn-secondary" onclick="startSurvey(2)" style="margin-top: 10px;">
              👤 2번째 분 (${STATE.user2.name || '배우자'}) 검사 시작하기
            </button>
          ` : ''}
          ${STATE.user1.name && STATE.user2.name ? `
            <button class="btn btn-primary" onclick="showResults()" style="background: linear-gradient(135deg, #10b981, #059669); margin-top: 12px;">
              🎉 두 분의 결과 확인하기
            </button>
          ` : ''}

          ${(STATE.user1.name || STATE.user2.name) ? `
            <button class="btn btn-secondary" onclick="resetAllState()" style="margin-top: 10px; font-size: 13px; padding: 10px; background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3);">
              🔄 새로 오신 손님용 초기화
            </button>
          ` : ''}

          <!-- 호스트 전용 Google Sheets 연동 설정 (접이식) -->
          <details style="margin-top: 24px; font-size: 13px; color: var(--text-muted); border-top: 1px dashed var(--border); padding-top: 16px;">
            <summary style="cursor: pointer; font-weight: 600; color: #cbd5e1;">⚙️ Google Sheets 실시간 자동 저장 설정 (호스트 전용)</summary>
            <div style="margin-top: 10px;">
              <p style="font-size: 12px; line-height: 1.4; margin-bottom: 8px;">
                Google 스프레드시트 Apps Script Web App URL을 등록하면, 결과 도출 시 시트에 행이 자동 기록됩니다.
              </p>
              <input type="text" id="sheets-url-input" class="input-field" placeholder="https://script.google.com/macros/s/.../exec" value="${STATE.sheetsWebhookUrl}" style="font-size: 12px; padding: 10px;">
              <button class="btn btn-secondary" style="font-size: 13px; padding: 8px;" onclick="saveSheetsUrl()">URL 저장하기</button>
            </div>
          </details>
        </div>
      `;
    }

    function saveSheetsUrl() {
      const val = document.getElementById('sheets-url-input').value.trim();
      STATE.sheetsWebhookUrl = val;
      localStorage.setItem('bobti_sheets_url', val);
      alert('Google Sheets Webhook URL이 저장되었습니다!');
      render();
    }

    function sendToGoogleSheets(matchResult) {
      if (!STATE.sheetsWebhookUrl) return;
      const u1 = matchResult.user1;
      const u2 = matchResult.user2;
      const couple = matchResult.couple;
      const rec = matchResult.recommendations;

      const payload = {
        user1Name: STATE.user1.name,
        user1Code: u1.code,
        user1Title: u1.typeInfo.title,
        user2Name: STATE.user2.name,
        user2Code: u2.code,
        user2Title: u2.typeInfo.title,
        coupleCode: couple.coupleCode,
        coupleTitle: couple.typeInfo.title,
        themes: matchResult.combinedThemes,
        opening: rec.opening.map(g => g.name),
        main: rec.main.map(g => g.name),
        next: rec.next.map(g => g.name)
      };

      fetch(STATE.sheetsWebhookUrl, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).then(() => {
        const el = document.getElementById('sheets-status');
        if (el) el.innerHTML = '📊 Google Sheets에 실시간 기록 완료!';
      }).catch(e => {
        console.warn('Sheets send error:', e);
      });
    }

    function copyResultSummary(matchResult) {
      const u1 = matchResult.user1;
      const u2 = matchResult.user2;
      const couple = matchResult.couple;
      const rec = matchResult.recommendations;

      const text = `[🎲 BOBTI 결과 - ${STATE.user1.name} & ${STATE.user2.name} 커플]\n` +
        `• ${STATE.user1.name}: ${u1.code} (${u1.typeInfo.title})\n` +
        `• ${STATE.user2.name}: ${u2.code} (${u2.typeInfo.title})\n` +
        `• 부부 종합: ${couple.coupleCode} (${couple.typeInfo.title})\n\n` +
        `🟢 1. Opening 추천:\n${rec.opening.map(g => '  - ' + g.name + ' (' + g.matchScore + '점)').join('\n')}\n\n` +
        `🔵 2. Main Game 추천:\n${rec.main.map(g => '  - ' + g.name + ' (' + g.matchScore + '점)').join('\n')}\n\n` +
        `🟣 3. Next Step 추천:\n${rec.next.map(g => '  - ' + g.name + ' (' + g.matchScore + '점)').join('\n')}`;

      navigator.clipboard.writeText(text).then(() => {
        alert('카톡 공유용 요약 결과가 클립보드에 복사되었습니다! 호스트에게 붙여넣기 하세요.');
      }).catch(() => {
        prompt('아래 내용을 복사하세요:', text);
      });
    }

    function renderResults(root) {
      const matchResult = matchGamesForCouple(STATE.user1, STATE.user2);
      const u1 = matchResult.user1;
      const u2 = matchResult.user2;
      const couple = matchResult.couple;
      const rec = matchResult.recommendations;

      // Google Sheets 전송 시도
      setTimeout(() => sendToGoogleSheets(matchResult), 100);

      root.innerHTML = `
        <div class="card">
          <h1>✨ BOBTI 분석 결과</h1>
          <p class="subtitle">${STATE.user1.name} & ${STATE.user2.name} 커플 맞춤형 Game Night 코스</p>

          <div id="sheets-status" style="font-size: 12px; color: #34d399; text-align: center; margin-bottom: 12px;"></div>

          <!-- 개인별 BOBTI -->
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px;">
            <div style="background: #0f172a; padding: 12px; border-radius: 12px; border: 1px solid var(--border);">
              <div style="font-size: 12px; color: var(--text-muted);">${STATE.user1.name}</div>
              <div style="font-size: 16px; font-weight: 800; color: #a5b4fc; margin: 4px 0;">${u1.typeInfo.icon} ${u1.code}</div>
              <div style="font-size: 12px; color: #cbd5e1; font-weight: 600;">${u1.typeInfo.title}</div>
            </div>
            <div style="background: #0f172a; padding: 12px; border-radius: 12px; border: 1px solid var(--border);">
              <div style="font-size: 12px; color: var(--text-muted);">${STATE.user2.name}</div>
              <div style="font-size: 16px; font-weight: 800; color: #f472b6; margin: 4px 0;">${u2.typeInfo.icon} ${u2.code}</div>
              <div style="font-size: 12px; color: #cbd5e1; font-weight: 600;">${u2.typeInfo.title}</div>
            </div>
          </div>

          <!-- 커플 종합 프로필 -->
          <div style="background: rgba(99, 102, 241, 0.15); border: 1px solid var(--primary-light); border-radius: 14px; padding: 16px; margin-bottom: 24px;">
            <div style="font-size: 12px; color: #c7d2fe; font-weight: 700;">💑 부부 종합 플레이 성향</div>
            <div style="font-size: 20px; font-weight: 800; color: #ffffff; margin: 6px 0;">
              ${couple.typeInfo.icon} ${couple.coupleCode} : ${couple.typeInfo.title}
            </div>
            <div style="font-size: 13px; color: #cbd5e1; line-height: 1.45;">
              ${couple.typeInfo.desc}
            </div>
            ${couple.conflicts.length > 0 ? `
              <div style="margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); font-size: 12px; color: #fbbf24;">
                ${couple.conflicts.map(c => `⚠️ ${c.text}`).join('<br>')}
              </div>
            ` : ''}
          </div>

          <!-- 호스트 카톡 전송 및 요약 복사 버튼 -->
          <button class="btn btn-primary" onclick='copyResultSummary(${JSON.stringify(matchResult).replace(/'/g, "\\'")})' style="margin-bottom: 20px; background: #fee500; color: #191600;">
            💬 카카오톡 전달용 요약 복사하기
          </button>

          <!-- 3단계 추천 코스 -->
          <h2 style="font-size: 18px; font-weight: 800; margin-bottom: 12px; color: #e2e8f0;">
            🎯 Game Night 3단계 코스 추천 (각 단계 택 1)
          </h2>

          <!-- 1단계: Opening Game -->
          <div style="margin-bottom: 20px;">
            <div style="font-size: 14px; font-weight: 700; color: #34d399; margin-bottom: 8px;">
              🟢 1. Opening Game (가벼운 아이스브레이킹)
            </div>
            ${rec.opening.map(g => renderGameCard(g)).join('')}
          </div>

          <!-- 2단계: Main Game -->
          <div style="margin-bottom: 20px;">
            <div style="font-size: 14px; font-weight: 700; color: #60a5fa; margin-bottom: 8px;">
              🔵 2. Main Game (오늘 밤의 메인 요리)
            </div>
            ${rec.main.map(g => renderGameCard(g)).join('')}
          </div>

          <!-- 3단계: Next Step -->
          <div style="margin-bottom: 20px;">
            <div style="font-size: 14px; font-weight: 700; color: #f472b6; margin-bottom: 8px;">
              🟣 3. Next Step (다음 모임 또는 심화 도전)
            </div>
            ${rec.next.map(g => renderGameCard(g)).join('')}
          </div>

          <button class="btn btn-secondary" onclick="resetAllState()" style="margin-top: 16px; background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3);">
            🔄 새로운 커플 검사하기 (초기화)
          </button>
          <button class="btn btn-secondary" onclick="STATE.step='home'; render();" style="margin-top: 8px;">
            🏠 홈으로 돌아가기
          </button>
        </div>
      `;
    }


    function renderGameCard(game) {
      return `
        <div class="game-card">
          <div class="game-title">
            <span>${game.name}</span>
            <span class="match-tag">${game.matchScore}점 일치</span>
          </div>
          <div class="game-meta">
            난이도 ${game.weight} / ${game.time} / 평점 ${game.rating || '-'} / 주인장 평점 ${game.hostRating || '-'}
          </div>
          <div class="game-summary">${game.summary}</div>
        </div>
      `;
    }

    // 초기화 실행
    loadSavedState();
    render();
  </script>
</body>
</html>

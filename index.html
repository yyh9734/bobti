<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BOBTI (보비티아이) - 나만의 보드게임 성향 검사</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-light: #6366f1;
      --secondary: #ec4899;
      --accent: #f59e0b;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 16px;
    }
    #app-container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding-bottom: 40px;
    }
    .card {
      background-color: var(--card-bg);
      border-radius: 20px;
      border: 1px solid var(--border);
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      text-align: center;
      background: linear-gradient(135deg, #a5b4fc, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 14px;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      background: rgba(99, 102, 241, 0.2);
      color: #a5b4fc;
      margin-bottom: 8px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px 20px;
      border-radius: 14px;
      border: none;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
      margin-top: 12px;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
    }
    .btn-primary:active {
      transform: scale(0.98);
      opacity: 0.9;
    }
    .btn-secondary {
      background: var(--border);
      color: var(--text);
    }
    .input-field {
      width: 100%;
      padding: 14px 16px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: white;
      font-size: 16px;
      margin-bottom: 16px;
      outline: none;
    }
    .input-field:focus {
      border-color: var(--primary-light);
    }
    .chip-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }
    .chip {
      padding: 14px 12px;
      border-radius: 12px;
      background: #0f172a;
      border: 1px solid var(--border);
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s ease;
    }
    .chip.selected {
      background: rgba(99, 102, 241, 0.25);
      border-color: var(--primary-light);
      color: #c7d2fe;
      font-weight: 600;
    }
    .question-title {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #e2e8f0;
    }
    .question-desc {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 12px;
      line-height: 1.4;
    }
    .option-btn {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      background: #0f172a;
      border: 1px solid var(--border);
      color: #cbd5e1;
      font-size: 14px;
      text-align: left;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.15s;
      line-height: 1.4;
    }
    .option-btn.selected {
      background: rgba(99, 102, 241, 0.2);
      border-color: var(--primary-light);
      color: #ffffff;
      font-weight: 600;
    }
    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: var(--border);
      border-radius: 10px;
      margin-bottom: 20px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      transition: width 0.3s ease;
    }
    .game-card {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      position: relative;
    }
    .game-title {
      font-size: 17px;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .game-meta {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .game-summary {
      font-size: 13px;
      color: #cbd5e1;
      line-height: 1.45;
    }
    .match-tag {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      padding: 2px 8px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div id="app-container"></div>

  <script src="data.js"></script>
  <script src="algorithm.js"></script>
  <script>
    // 1인 전용 상태 관리
    const STATE = {
      step: 'home', // 'home', 'name', 'theme', 'scenario', 'time', 'results'
      sheetsWebhookUrl: localStorage.getItem('bobti_sheets_url') || '',
      githubToken: localStorage.getItem('bobti_gh_token') || '',
      user: {
        name: '',
        themes: [],
        answers: {},
        timePref: '30~60분'
      },
      currentScenarioIndex: 0
    };

    function loadSavedState() {
      const urlParams = new URLSearchParams(window.location.search);
      const tokenParam = urlParams.get('gh_token');
      if (tokenParam) {
        localStorage.setItem('bobti_gh_token', tokenParam);
        STATE.githubToken = tokenParam;
      }

      const saved = localStorage.getItem('bobti_single_state');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          Object.assign(STATE, parsed);
        } catch (e) {}
      }
      STATE.sheetsWebhookUrl = localStorage.getItem('bobti_sheets_url') || STATE.sheetsWebhookUrl || '';
      STATE.githubToken = localStorage.getItem('bobti_gh_token') || STATE.githubToken || '';
    }

    function saveState() {
      localStorage.setItem('bobti_single_state', JSON.stringify(STATE));
      if (STATE.sheetsWebhookUrl) {
        localStorage.setItem('bobti_sheets_url', STATE.sheetsWebhookUrl);
      }
      if (STATE.githubToken) {
        localStorage.setItem('bobti_gh_token', STATE.githubToken);
      }
    }

    function resetTest() {
      if (confirm('새로운 검사를 시작하시겠습니까? 기존 입력 내용이 초기화됩니다.')) {
        const urlBackup = STATE.sheetsWebhookUrl;
        const ghBackup = STATE.githubToken;
        STATE.step = 'home';
        STATE.user = { name: '', themes: [], answers: {}, timePref: '30~60분' };
        STATE.currentScenarioIndex = 0;
        STATE.sheetsWebhookUrl = urlBackup;
        STATE.githubToken = ghBackup;
        localStorage.removeItem('bobti_single_state');
        saveState();
        render();
      }
    }

    function render() {
      const root = document.getElementById('app-container');
      root.innerHTML = '';

      switch (STATE.step) {
        case 'home':
          renderHome(root);
          break;
        case 'name':
          renderNamePage(root);
          break;
        case 'theme':
          renderThemePage(root);
          break;
        case 'scenario':
          renderScenarioPage(root);
          break;
        case 'time':
          renderTimePage(root);
          break;
        case 'results':
          renderResults(root);
          break;
        default:
          renderHome(root);
      }
    }

    // 1. 홈 화면
    function renderHome(root) {
      root.innerHTML = `
        <div class="card">
          <div style="text-align: center; font-size: 42px; margin-bottom: 12px;">🎲✨</div>
          <h1>BOBTI 보비티아이</h1>
          <p class="subtitle">나만의 보드게임 성향 분석 & 오늘 밤 맞춤 게임 코스 추천</p>
          
          <div style="background: rgba(99, 102, 241, 0.1); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 20px;">
            <div style="font-weight: 700; color: #a5b4fc; margin-bottom: 6px; font-size: 15px;">💡 진행 안내</div>
            <div style="font-size: 13px; color: #cbd5e1; line-height: 1.5;">
              • 약 <strong>2~3분</strong>이면 검사가 완료됩니다.<br>
              • 나의 플레이 성향(경쟁, 전략, 몰입도, 공격성)을 알아봅니다.<br>
              • 호스트가 소장한 <strong>41개 명작 보드게임</strong> 중 내 취향에 딱 맞는 <strong>Opening → Main → Next Step → 최종 목표</strong> 코스를 찾아드립니다!
            </div>
          </div>

          <button class="btn btn-primary" onclick="STATE.step='name'; saveState(); render();">
            👉 검사 시작하기
          </button>

          ${STATE.user.name ? `
            <button class="btn btn-secondary" onclick="STATE.step='results'; saveState(); render();" style="margin-top: 10px;">
              📄 이전 결과 다시보기 (${STATE.user.name} 님)
            </button>
            <button class="btn btn-secondary" onclick="resetTest()" style="margin-top: 10px; font-size: 13px; padding: 10px; background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3);">
              🔄 새로 시작하기 (초기화)
            </button>
          ` : ''}

          <!-- 호스트 전용 GitHub 자동 저장 연동 설정 (접이식) -->
          <details style="margin-top: 24px; font-size: 13px; color: var(--text-muted); border-top: 1px dashed var(--border); padding-top: 16px;">
            <summary style="cursor: pointer; font-weight: 600; color: #cbd5e1;">⚙️ GitHub Issues 무로그인 자동 저장 설정 (호스트 전용)</summary>
            <div style="margin-top: 10px;">
              <p style="font-size: 12px; line-height: 1.4; margin-bottom: 8px;">
                손님이 로그인 없이 결과 확인만 해도 호스트의 GitHub Issues에 글이 실시간 자동 등록되도록 연동합니다.
              </p>
              <input type="password" id="gh-token-input" class="input-field" placeholder="github_pat_... 또는 gho_..." value="${STATE.githubToken}" style="font-size: 12px; padding: 10px;">
              <button class="btn btn-secondary" style="font-size: 13px; padding: 8px;" onclick="saveGithubToken()">GitHub 토큰 저장하기</button>
            </div>
          </details>
        </div>
      `;
    }

    function saveGithubToken() {
      const val = document.getElementById('gh-token-input').value.trim();
      STATE.githubToken = val;
      localStorage.setItem('bobti_gh_token', val);
      alert('GitHub 토큰이 브라우저에 저장되었습니다! 이제 손님이 제출 시 Issues에 백그라운드로 자동 저장됩니다.');
      render();
    }


    // 2. 이름 입력 전용 페이지
    function renderNamePage(root) {
      root.innerHTML = `
        <div class="card">
          <span class="badge">Step 1 / 4</span>
          <div class="question-title" style="font-size: 19px; margin-top: 6px;">참가자 성함을 알려주세요</div>
          <div class="question-desc">결과 카드에 표시될 이름이나 별명을 적어주세요.</div>

          <input type="text" class="input-field" placeholder="예: 영희, 민수, 주인장" value="${STATE.user.name}" id="name-input" autofocus>

          <button class="btn btn-primary" onclick="submitName()">다음으로</button>
          <button class="btn btn-secondary" onclick="STATE.step='home'; render();" style="margin-top: 10px;">처음으로</button>
        </div>
      `;
    }

    function submitName() {
      const input = document.getElementById('name-input');
      const name = input ? input.value.trim() : '';
      if (!name) {
        alert('성함이나 닉네임을 입력해주세요!');
        return;
      }
      STATE.user.name = name;
      STATE.step = 'theme';
      saveState();
      render();
    }

    // 3. 선호 테마 선택 전용 페이지
    function renderThemePage(root) {
      const themes = [
        { id: '히어로', name: '🦸 히어로 / 마블' },
        { id: 'SF', name: '🚀 우주 / SF / 탐험' },
        { id: '판타지', name: '🐉 판타지 / 모험' },
        { id: '경제', name: '🏭 경제 / 경영 / 건설' },
        { id: '아시아', name: '🎌 동양 / 일본 / 역사' },
        { id: '서부', name: '🤠 서부 / 범죄 / 카지노' },
        { id: '음식', name: '🍜 음식 / 요리 / 동물' },
        { id: '일상', name: '🎲 가벼운 파티 / 유머' }
      ];

      root.innerHTML = `
        <div class="card">
          <span class="badge">Step 2 / 4</span>
          <div class="question-title" style="font-size: 19px; margin-top: 6px;">끌리는 테마나 세계관을 골라주세요</div>
          <div class="question-desc">선호하는 분위기를 여러 개 선택하실 수 있습니다. (없으시면 바로 다음 클릭)</div>

          <div class="chip-grid">
            ${themes.map(t => `
              <div class="chip ${STATE.user.themes.includes(t.id) ? 'selected' : ''}" onclick="toggleTheme('${t.id}')">
                ${t.name}
              </div>
            `).join('')}
          </div>

          <div style="display: flex; gap: 10px;">
            <button class="btn btn-secondary" style="flex: 1;" onclick="STATE.step='name'; render();">이전</button>
            <button class="btn btn-primary" style="flex: 2;" onclick="STATE.step='scenario'; STATE.currentScenarioIndex=0; saveState(); render();">질문 시작하기</button>
          </div>
        </div>
      `;
    }

    function toggleTheme(themeId) {
      if (STATE.user.themes.includes(themeId)) {
        STATE.user.themes = STATE.user.themes.filter(t => t !== themeId);
      } else {
        STATE.user.themes.push(themeId);
      }
      saveState();
      render();
    }

    // 4. 시나리오 문항 페이지 (8문항 슬라이드)
    function renderScenarioPage(root) {
      const qIndex = STATE.currentScenarioIndex;
      const q = SCENARIO_QUESTIONS[qIndex];
      const progress = ((qIndex + 1) / SCENARIO_QUESTIONS.length) * 100;
      const selectedScore = STATE.user.answers[q.id];

      root.innerHTML = `
        <div class="card">
          <div class="progress-bar-container">
            <div class="progress-fill" style="width: ${progress}%;"></div>
          </div>
          <span class="badge">Step 3 / 4 • ${q.situation} (${qIndex + 1}/${SCENARIO_QUESTIONS.length})</span>
          <div class="question-title" style="font-size: 18px; margin-top: 6px;">${q.question}</div>
          <div class="question-desc">편하게 떠오르는 나의 성향에 가장 가까운 선택지를 골라주세요.</div>

          <div style="margin-top: 16px;">
            ${q.options.map((opt) => `
              <button class="option-btn ${selectedScore === opt.score ? 'selected' : ''}" onclick="chooseScenarioAnswer('${q.id}', ${opt.score})">
                ${opt.text}
              </button>
            `).join('')}
          </div>

          <div style="display: flex; gap: 10px; margin-top: 14px;">
            <button class="btn btn-secondary" style="flex: 1;" onclick="prevScenario()">이전</button>
            <button class="btn btn-primary" style="flex: 2;" onclick="nextScenario()">다음</button>
          </div>
        </div>
      `;
    }

    function chooseScenarioAnswer(qId, score) {
      STATE.user.answers[qId] = score;
      saveState();
      render();
    }

    function prevScenario() {
      if (STATE.currentScenarioIndex > 0) {
        STATE.currentScenarioIndex--;
      } else {
        STATE.step = 'theme';
      }
      saveState();
      render();
    }

    function nextScenario() {
      const q = SCENARIO_QUESTIONS[STATE.currentScenarioIndex];
      if (typeof STATE.user.answers[q.id] === 'undefined') {
        alert('선택지를 하나 골라주세요!');
        return;
      }
      if (STATE.currentScenarioIndex < SCENARIO_QUESTIONS.length - 1) {
        STATE.currentScenarioIndex++;
      } else {
        STATE.step = 'time';
      }
      saveState();
      render();
    }

    // 5. 플레이 타임 선택 페이지
    function renderTimePage(root) {
      const timeOptions = [
        '10~20분 (초간단 파티)',
        '20~40분 (적당한 집중)',
        '40~60분 (알찬 전략)',
        '60분 이상도 집중 가능!'
      ];

      root.innerHTML = `
        <div class="card">
          <span class="badge">Step 4 / 4 (마지막!)</span>
          <div class="question-title" style="font-size: 19px; margin-top: 6px;">선호하는 플레이 타임</div>
          <div class="question-desc">한 게임당 어느 정도 호흡이 가장 편안하신가요?</div>

          <div style="margin-bottom: 20px;">
            ${timeOptions.map(time => `
              <button class="option-btn ${STATE.user.timePref === time ? 'selected' : ''}" onclick="selectTime('${time}')">
                ⏱️ ${time}
              </button>
            `).join('')}
          </div>

          <div style="display: flex; gap: 10px;">
            <button class="btn btn-secondary" style="flex: 1;" onclick="STATE.step='scenario'; STATE.currentScenarioIndex = SCENARIO_QUESTIONS.length - 1; render();">이전</button>
            <button class="btn btn-primary" style="flex: 2;" onclick="STATE.step='results'; saveState(); render();">결과 확인하기 🎉</button>
          </div>
        </div>
      `;
    }

    function selectTime(time) {
      STATE.user.timePref = time;
      saveState();
      render();
    }

    // 6. 결과 화면 (1인 단독 결과 & 4단계 추천)
    function renderResults(root) {
      const matchResult = matchGamesForIndividual(STATE.user);
      const u = matchResult.user;
      const rec = matchResult.recommendations;

      // GitHub Issues & Google Sheets 실시간 백그라운드 자동 전송 시도
      setTimeout(() => {
        autoSaveToGithubIssues(matchResult);
        sendSingleResultToSheets(matchResult);
      }, 100);

      root.innerHTML = `
        <div class="card">
          <h1>✨ ${STATE.user.name} 님의 BOBTI</h1>
          <p class="subtitle">나의 성향 분석 & Game Night 맞춤 추천 코스</p>

          <div id="save-status" style="font-size: 13px; font-weight: 600; color: #34d399; text-align: center; margin-bottom: 12px;"></div>

          <!-- 내 BOBTI 유형 카드 -->
          <div style="background: rgba(99, 102, 241, 0.15); border: 1px solid var(--primary-light); border-radius: 16px; padding: 20px; margin-bottom: 20px; text-align: center;">
            <div style="font-size: 40px; margin-bottom: 6px;">${u.typeInfo.icon}</div>
            <div style="font-size: 22px; font-weight: 800; color: #ffffff; margin-bottom: 4px;">
              ${u.code} : ${u.typeInfo.title}
            </div>
            <div style="font-size: 14px; color: #cbd5e1; line-height: 1.5; margin-top: 10px; text-align: left; background: #0f172a; padding: 12px; border-radius: 10px;">
              ${u.typeInfo.desc}
            </div>
            <div style="display: flex; justify-content: space-around; margin-top: 14px; font-size: 12px; color: #94a3b8;">
              <span>${u.scores.vc < 0 ? '⚔️ 경쟁형' : '🤝 협력형'}</span>
              <span>${u.scores.bs < 0 ? '🧠 두뇌계획' : '⚡ 직감감각'}</span>
              <span>${u.scores.dl < 0 ? '🌌 깊은몰입' : '🎈 가벼움'}</span>
              <span>${u.scores.ag < 0 ? '🎯 견제공격' : '🛡️ 평화수비'}</span>
            </div>
          </div>

          <!-- 카카오톡 공유 버튼 -->
          <button class="btn btn-primary" onclick='copySingleSummary(${JSON.stringify(matchResult).replace(/'/g, "\\'")})' style="margin-bottom: 12px; background: #fee500; color: #191600;">
            💬 호스트 전달용 카톡 요약 복사하기
          </button>

          <!-- 보조 수동 GitHub 저장 버튼 -->
          <button class="btn btn-secondary" onclick='openGithubIssue(${JSON.stringify(matchResult).replace(/'/g, "\\'")})' style="margin-bottom: 24px; font-size: 13px; padding: 10px;">
            🐙 GitHub Issues 수동 등록 (직접 글쓰기 창 열기)
          </button>

          <!-- 4단계 추천 게임 -->
          <h2 style="font-size: 18px; font-weight: 800; margin-bottom: 12px; color: #e2e8f0;">
            🎯 내 취향 맞춤 4단계 코스 추천
          </h2>

          <!-- 1단계: Opening -->
          <div style="margin-bottom: 20px;">
            <div style="font-size: 14px; font-weight: 700; color: #34d399; margin-bottom: 8px;">
              🟢 1. Opening Game (가벼운 아이스브레이킹)
            </div>
            ${rec.opening.map(g => renderGameCard(g)).join('')}
          </div>

          <!-- 2단계: Main -->
          <div style="margin-bottom: 20px;">
            <div style="font-size: 14px; font-weight: 700; color: #60a5fa; margin-bottom: 8px;">
              🔵 2. Main Game (오늘 밤의 메인 요리)
            </div>
            ${rec.main.map(g => renderGameCard(g)).join('')}
          </div>

          <!-- 3단계: Next Step -->
          <div style="margin-bottom: 20px;">
            <div style="font-size: 14px; font-weight: 700; color: #c084fc; margin-bottom: 8px;">
              🟣 3. Next Step (다음 모임의 성장 발판)
            </div>
            ${rec.next.map(g => renderGameCard(g)).join('')}
          </div>

          <!-- 4단계: 주인장의 최종 목표 -->
          <div style="margin-bottom: 20px;">
            <div style="font-size: 14px; font-weight: 700; color: #fbbf24; margin-bottom: 8px; display: flex; align-items: center; gap: 6px;">
              <span>👑 4. 주인장의 최종 목표 (Masterpiece)</span>
              <span style="font-size: 11px; background: rgba(251, 191, 36, 0.2); color: #fde68a; padding: 2px 6px; border-radius: 6px;">언젠가 함께 도달할 고난도 명작!</span>
            </div>
            ${rec.masterpiece.map(g => renderGameCard(g, true)).join('')}
          </div>

          <button class="btn btn-secondary" onclick="resetTest()" style="margin-top: 16px; background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3);">
            🔄 새로운 사람 검사하기 (초기화)
          </button>
          <button class="btn btn-secondary" onclick="STATE.step='home'; render();" style="margin-top: 8px;">
            🏠 홈으로 돌아가기
          </button>
        </div>
      `;
    }

    function renderGameCard(game, isMasterpiece = false) {
      return `
        <div class="game-card" ${isMasterpiece ? 'style="border-color: rgba(251, 191, 36, 0.4); background: #161e2e;"' : ''}>
          <div class="game-title">
            <span>${game.name}</span>
            <span class="match-tag" ${isMasterpiece ? 'style="background: linear-gradient(135deg, #d97706, #b45309);"' : ''}>${game.matchScore}점 일치</span>
          </div>
          <div class="game-meta">
            난이도 ${game.weight} / ${game.time} / BGG ${game.rating || '-'} / 주인장 평점 ${game.hostRating || '-'}
          </div>
          <div class="game-summary">${game.summary}</div>
        </div>
      `;
    }

    function autoSaveToGithubIssues(matchResult) {
      if (!STATE.githubToken) return;
      const u = matchResult.user;
      const rec = matchResult.recommendations;

      const title = `[BOBTI 결과] ${STATE.user.name} - ${u.code} (${u.typeInfo.title})`;
      const body = `### 🎲 BOBTI 성향 검사 응답 결과

| 항목 | 내용 |
| :--- | :--- |
| **참가자 이름** | **${STATE.user.name}** |
| **BOBTI 유형** | **${u.typeInfo.icon} ${u.code} (${u.typeInfo.title})** |
| **선호 테마** | ${STATE.user.themes.join(', ') || '없음'} |
| **희망 플레이 타임** | ${STATE.user.timePref} |

---

### 🎯 4단계 맞춤 게임 추천 코스

#### 🟢 1. Opening Game (워밍업)
${rec.opening.map(g => `- **${g.name}** (${g.matchScore}점 일치 / 난이도 ${g.weight} / ${g.time})`).join('\n')}

#### 🔵 2. Main Game (오늘 밤의 메인)
${rec.main.map(g => `- **${g.name}** (${g.matchScore}점 일치 / 난이도 ${g.weight} / ${g.time})`).join('\n')}

#### 🟣 3. Next Step (성장 발판)
${rec.next.map(g => `- **${g.name}** (${g.matchScore}점 일치 / 난이도 ${g.weight} / ${g.time})`).join('\n')}

#### 👑 4. 주인장의 최종 목표 (Masterpiece)
${rec.masterpiece.map(g => `- **${g.name}** (난이도 ${g.weight} / ${g.time}) - *${g.summary}*`).join('\n')}

> *이 응답은 손님 무로그인 상태에서 BOBTI 앱을 통해 GitHub에 자동 저장되었습니다.*`;

      fetch('https://api.github.com/repos/yyh9734/bobti/issues', {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${STATE.githubToken}`,
          'Accept': 'application/vnd.github+json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ title, body })
      }).then(res => {
        if (res.ok) {
          const el = document.getElementById('save-status');
          if (el) el.innerHTML = '🐙 호스트 GitHub 저장소에 자동 저장 완료!';
        }
      }).catch(err => {
        console.warn('Auto save error:', err);
      });
    }

    function sendSingleResultToSheets(matchResult) {
      if (!STATE.sheetsWebhookUrl) return;
      const u = matchResult.user;
      const rec = matchResult.recommendations;

      const payload = {
        userName: STATE.user.name,
        userCode: u.code,
        userTitle: u.typeInfo.title,
        themes: STATE.user.themes,
        timePref: STATE.user.timePref,
        opening: rec.opening.map(g => g.name),
        main: rec.main.map(g => g.name),
        next: rec.next.map(g => g.name),
        masterpiece: rec.masterpiece.map(g => g.name)
      };

      fetch(STATE.sheetsWebhookUrl, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).then(() => {
        const el = document.getElementById('save-status');
        if (el && !el.innerHTML) el.innerHTML = '📊 Google Sheets에 실시간 기록 완료!';
      }).catch(e => {
        console.warn('Sheets send error:', e);
      });
    }

    function copySingleSummary(matchResult) {
      const u = matchResult.user;
      const rec = matchResult.recommendations;

      const text = `[🎲 BOBTI 보드게임 성향 결과]\n` +
        `• 참가자: ${STATE.user.name}\n` +
        `• 성향: ${u.typeInfo.icon} ${u.code} (${u.typeInfo.title})\n` +
        `• 선호 테마: ${STATE.user.themes.join(', ') || '자유'}\n` +
        `• 선호 시간: ${STATE.user.timePref}\n\n` +
        `🟢 1. Opening 추천:\n${rec.opening.map(g => '  - ' + g.name + ' (' + g.matchScore + '점)').join('\n')}\n\n` +
        `🔵 2. Main Game 추천:\n${rec.main.map(g => '  - ' + g.name + ' (' + g.matchScore + '점)').join('\n')}\n\n` +
        `🟣 3. Next Step 추천:\n${rec.next.map(g => '  - ' + g.name + ' (' + g.matchScore + '점)').join('\n')}\n\n` +
        `👑 4. 주인장의 최종 목표 (Masterpiece):\n${rec.masterpiece.map(g => '  - ' + g.name + ' (난이도 ' + g.weight + ')').join('\n')}`;

      navigator.clipboard.writeText(text).then(() => {
        alert('카톡 공유용 요약 결과가 복사되었습니다! 호스트에게 붙여넣기 하세요.');
      }).catch(() => {
        prompt('아래 내용을 복사하세요:', text);
      });
    }

    function openGithubIssue(matchResult) {
      const u = matchResult.user;
      const rec = matchResult.recommendations;

      const title = encodeURIComponent(`[BOBTI 결과] ${STATE.user.name} - ${u.code} (${u.typeInfo.title})`);
      
      const bodyText = `### 🎲 BOBTI 성향 검사 응답 결과

| 항목 | 내용 |
| :--- | :--- |
| **참가자 이름** | **${STATE.user.name}** |
| **BOBTI 유형** | **${u.typeInfo.icon} ${u.code} (${u.typeInfo.title})** |
| **선호 테마** | ${STATE.user.themes.join(', ') || '없음'} |
| **희망 플레이 타임** | ${STATE.user.timePref} |

---

### 🎯 4단계 맞춤 게임 추천 코스

#### 🟢 1. Opening Game (워밍업)
${rec.opening.map(g => `- **${g.name}** (${g.matchScore}점 일치 / 난이도 ${g.weight} / ${g.time})`).join('\n')}

#### 🔵 2. Main Game (오늘 밤의 메인)
${rec.main.map(g => `- **${g.name}** (${g.matchScore}점 일치 / 난이도 ${g.weight} / ${g.time})`).join('\n')}

#### 🟣 3. Next Step (성장 발판)
${rec.next.map(g => `- **${g.name}** (${g.matchScore}점 일치 / 난이도 ${g.weight} / ${g.time})`).join('\n')}

#### 👑 4. 주인장의 최종 목표 (Masterpiece)
${rec.masterpiece.map(g => `- **${g.name}** (난이도 ${g.weight} / ${g.time}) - *${g.summary}*`).join('\n')}

> *이 응답은 BOBTI 웹 애플리케이션에서 자동 생성되었습니다.*`;

      const body = encodeURIComponent(bodyText);
      const url = `https://github.com/yyh9734/bobti/issues/new?title=${title}&body=${body}`;
      
      window.open(url, '_blank');
    }

    // 초기 로딩
    loadSavedState();
    render();
  </script>
</body>
</html>
